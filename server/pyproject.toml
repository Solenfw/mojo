[project]
name = "mojo-server"
version = "0.1.0"
description = "Mojo API: FastAPI backend for AI-assisted Japanese learning."
readme = "README.md"
requires-python = ">=3.12"
# Direct dependencies only (what the code imports or runs); uv.lock pins everything else.
dependencies = [
    "alembic>=1.18.4",
    "anyio>=4.13.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.136.1",
    "mecab-python3>=1.0.12",
    "psycopg2-binary>=2.9.12",  # sync driver used by Alembic migrations
    "pydantic[email]>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pyjwt>=2.10",
    "python-multipart>=0.0.27",  # OAuth2 form login
    "sqlalchemy[asyncio]>=2.0.49",
    "unidic-lite>=1.0.8",  # MeCab dictionary
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.18",
    "pre-commit>=4.3",
    "pytest>=9.1.1",
    "ruff>=0.13",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions", "scripts/seeder.py"]  # generated by Alembic; seeder pending rework

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["MeCab", "unidic", "unidic_lite"]  # ship no type information
ignore_missing_imports = true
