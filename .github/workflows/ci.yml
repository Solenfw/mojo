name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (lint, types, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mojo
          POSTGRES_PASSWORD: mojo
          POSTGRES_DB: mojo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mojo:mojo@localhost:5432/mojo_test
      TEST_DATABASE_URL: postgresql://mojo:mojo@localhost:5432/mojo_test
      SECRET_KEY: ci-only-secret-key-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Migrations apply and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest -q

  client:
    name: Client (lint, type-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  contract:
    name: API contract is up to date
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://unused@localhost/unused
      SECRET_KEY: ci-only-secret-key-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd server && uv sync --locked && uv run python -m scripts.export_openapi
      - run: cd client && npm ci && npm run gen:api
      - name: Fail if the committed contract or client types are stale
        run: git diff --exit-code -- client/openapi.json client/src/types/api.generated.ts
